name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  agents-drift:
    name: Agents drift check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify agent mirrors are byte-identical
        shell: pwsh
        run: pwsh -NoProfile ./scripts/agents-check-drift.ps1

  build-and-test:
    name: Build + tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore BookSlot.slnx

      - name: Build
        run: dotnet build BookSlot.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/BookSlot.UnitTests/BookSlot.UnitTests.csproj
             --configuration Release --no-build --logger "trx;LogFileName=unit.trx"
             --collect:"XPlat Code Coverage" --settings coverlet.runsettings
             --results-directory ./TestResults

      - name: Architecture tests
        run: dotnet test tests/BookSlot.ArchitectureTests/BookSlot.ArchitectureTests.csproj
             --configuration Release --no-build --logger "trx;LogFileName=arch.trx"
             --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

  integration-tests:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}

      - name: Restore
        run: dotnet restore BookSlot.slnx

      - name: Integration tests
        run: dotnet test tests/BookSlot.IntegrationTests/BookSlot.IntegrationTests.csproj
             --configuration Release --logger "trx;LogFileName=integration.trx"
             --results-directory ./TestResults
        continue-on-error: true

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults/
